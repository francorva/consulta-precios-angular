<div class="form-container">
  <div>
    <a routerLink="/" class="btn-volver">← Volver al catálogo</a>
  </div>

  <h2>Editor de Productos</h2>

  <!-- Alerta de éxito cuando se guardan los cambios -->
  <div *ngIf="mensajeExito()" class="alert alert-success mt-3 p-2 text-center" style="background-color: #d1e7dd; color: #0f5132; border-radius: 4px; margin-bottom: 15px;">
    {{ mensajeExito() }}
  </div>

  <form [formGroup]="productoForm" (ngSubmit)="guardar()">

    <!-- Código con botón Buscar al lado -->
    <div class="form-group">
      <label>Código del Producto</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" formControlName="codigo" placeholder="Ej: 1001" style="flex: 1;">
        <button type="button" class="btn-buscar" (click)="buscarProducto()">Buscar</button>
      </div>
      <div *ngIf="mensajeBusqueda()" style="font-size: 12px; margin-top: 4px; color: #3182ce;">
        {{ mensajeBusqueda() }}
      </div>
    </div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" placeholder="Nombre del producto">
    </div>

    <div class="form-group">
      <label>Precio Unitario</label>
      <input type="number" formControlName="precioUnitario">
    </div>

    <div class="form-group">
      <label>Existencias (Stock)</label>
      <input type="number" formControlName="stock">
    </div>

    <div class="form-group">
      <label>ID Categoría</label>
      <input type="number" formControlName="categoriaId" placeholder="Ej: 1">
    </div>

    <div class="form-group">
      <label for="foto">Imagen del Producto</label>
      <input
        type="file"
        id="foto"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="form-control"
      >
    </div>

    <!-- Botones inferiores -->
    <div class="form-actions">
      <div style="display: flex; gap: 10px;">
        <a routerLink="/" class="btn-cancelar" style="align-self: center;">Cancelar</a>
        <!-- Botón Eliminar dinámico con codigoOriginal -->
        <button type="button" *ngIf="codigoOriginal !== null" class="btn-eliminar" (click)="eliminarProducto()">Eliminar</button>
      </div>

      <!-- Botón Guardar / Crear con indicador de carga y texto dinámico -->
      <button type="submit" class="btn-guardar" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : (codigoOriginal !== null ? 'Guardar Cambios' : 'Crear Producto') }}
      </button>
    </div>

  </form>
</div>
